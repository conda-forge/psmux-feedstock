context:
  version: "3.4.0"

package:
  name: psmux
  version: ${{ version }}

source:
  url: https://github.com/psmux/psmux/archive/refs/tags/v${{ version }}.tar.gz
  sha256: a25b97ce1ca3624d73b79bedbd672d1235c5a146a5c819b87e0023362ad431e2

build:
  skip: unix
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path .
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script:
      - psmux --help
      - pmux --help
      - tmux --help
  - package_contents:
      bin:
        - psmux
        - pmux
        - tmux
      strict: true

about:
  homepage: https://psmux.pages.dev
  summary: Native Windows terminal multiplexer with tmux compatibility
  description: |
    psmux is a native Windows terminal multiplexer built in Rust. It uses
    Windows ConPTY, supports tmux commands and configuration, and provides
    psmux, pmux, and tmux command line executables.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/psmux/psmux

extra:
  recipe-maintainers:
    - jsmolic
